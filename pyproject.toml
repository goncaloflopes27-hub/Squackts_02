[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
  ".venv",
  "build",
  "dist",
  "ui",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP017"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
files = [
  "db.py",
  "repositories",
  "schema.py",
  "service_container.py",
  "services",
  "utils.py",
]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
disallow_untyped_defs = true
disable_error_code = ["arg-type", "call-overload"]
pretty = true

[[tool.mypy.overrides]]
module = ["PySide6.*"]
ignore_missing_imports = true
